<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="8" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="-8" dy="-8" stdDeviation="12" flood-color="#fff" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="280" fill="url(#bg)" rx="12"/>

  <!-- Left panel -->
  <rect x="20" y="20" width="140" height="240" fill="#1e1e32" rx="8"/>

  <text x="32" y="42" fill="#888" font-size="8" font-family="sans-serif">Neumorphism</text>
  <rect x="32" y="50" width="56" height="18" fill="#6366f1" rx="4"/>
  <rect x="92" y="50" width="56" height="18" fill="#2a2a40" rx="4"/>
  <rect x="32" y="74" width="56" height="18" fill="#2a2a40" rx="4"/>
  <rect x="92" y="74" width="56" height="18" fill="#2a2a40" rx="4"/>

  <text x="32" y="114" fill="#888" font-size="8" font-family="sans-serif">Layer 1</text>
  <rect x="32" y="122" width="116" height="80" fill="#2a2a40" rx="4" opacity="0.5"/>
  <text x="40" y="140" fill="#6366f1" font-size="7" font-family="monospace">X: 4</text>
  <text x="80" y="140" fill="#6366f1" font-size="7" font-family="monospace">Y: 6</text>
  <text x="40" y="156" fill="#6366f1" font-size="7" font-family="monospace">Blur: 12</text>
  <text x="80" y="156" fill="#6366f1" font-size="7" font-family="monospace">Spread: 0</text>
  <rect x="40" y="166" width="80" height="6" fill="#3a3a52" rx="3"/>

  <!-- Preview -->
  <rect x="176" y="20" width="404" height="180" fill="#e8ebf0" rx="8"/>
  <rect x="310" y="55" width="140" height="110" fill="#e8ebf0" rx="24" filter="url(#shadow1)"/>
  <rect x="310" y="55" width="140" height="110" fill="#e8ebf0" rx="24" filter="url(#shadow2)"/>
  <text x="380" y="115" fill="#9ca3af" font-size="9" font-family="sans-serif" text-anchor="middle">Raised</text>

  <!-- Code -->
  <rect x="176" y="210" width="404" height="50" fill="#1a1a2e" rx="6"/>
  <circle cx="198" cy="235" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="212" cy="235" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="226" cy="235" r="4" fill="#22c55e" opacity="0.6"/>
  <text x="250" y="238" fill="#a5b4fc" font-size="10" font-family="monospace">box-shadow: 8px 8px 16px #0003, -8px -8px 16px #fff2;</text>

  <text x="36" y="240" fill="#fff" font-size="12" font-family="sans-serif" font-weight="600">Box Shadow</text>
  <text x="36" y="254" fill="#666" font-size="8" font-family="sans-serif">multi-layer · neumorphism</text>
</svg>

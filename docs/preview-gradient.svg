<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="demo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="600" height="280" fill="url(#bg)" rx="12"/>

  <!-- Left panel -->
  <rect x="20" y="20" width="140" height="240" fill="#1e1e32" rx="8"/>

  <text x="32" y="42" fill="#888" font-size="8" font-family="sans-serif">Type</text>
  <rect x="32" y="50" width="38" height="18" fill="#6366f1" rx="4"/>
  <rect x="74" y="50" width="38" height="18" fill="#2a2a40" rx="4"/>
  <rect x="116" y="50" width="38" height="18" fill="#2a2a40" rx="4"/>

  <text x="32" y="90" fill="#888" font-size="8" font-family="sans-serif">Angle · 135deg</text>
  <rect x="32" y="98" width="116" height="12" fill="#2a2a40" rx="6"/>
  <circle cx="80" cy="104" r="5" fill="#6366f1"/>

  <text x="32" y="132" fill="#888" font-size="8" font-family="sans-serif">Color Stops</text>
  <circle cx="40" cy="150" r="8" fill="#6366f1"/>
  <rect x="54" y="146" width="80" height="8" fill="#2a2a40" rx="4"/>
  <circle cx="90" cy="150" r="5" fill="#a5b4fc"/>
  <circle cx="40" cy="172" r="8" fill="#ec4899"/>
  <rect x="54" y="168" width="80" height="8" fill="#2a2a40" rx="4"/>
  <circle cx="115" cy="172" r="5" fill="#f9a8d4"/>

  <!-- Preview -->
  <rect x="176" y="20" width="404" height="180" fill="#1e1e32" rx="8"/>
  <rect x="240" y="40" width="270" height="140" fill="url(#demo)" rx="10"/>

  <!-- Code -->
  <rect x="176" y="210" width="404" height="50" fill="#1a1a2e" rx="6"/>
  <circle cx="198" cy="235" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="212" cy="235" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="226" cy="235" r="4" fill="#22c55e" opacity="0.6"/>
  <text x="250" y="238" fill="#a5b4fc" font-size="10" font-family="monospace">background: linear-gradient(135deg, #6366f1 0%, #a855f7 40%, #ec4899 100%);</text>

  <text x="36" y="240" fill="#fff" font-size="12" font-family="sans-serif" font-weight="600">Gradient</text>
  <text x="36" y="254" fill="#666" font-size="8" font-family="sans-serif">linear · radial · conic</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="600" height="280" fill="url(#bg)" rx="12"/>

  <!-- Left panel -->
  <rect x="20" y="20" width="140" height="240" fill="#1e1e32" rx="8"/>

  <text x="32" y="42" fill="#888" font-size="8" font-family="sans-serif">Unit</text>
  <rect x="32" y="50" width="56" height="18" fill="#6366f1" rx="4"/>
  <rect x="92" y="50" width="56" height="18" fill="#2a2a40" rx="4"/>

  <text x="32" y="90" fill="#888" font-size="8" font-family="sans-serif">Mode</text>
  <rect x="32" y="98" width="56" height="18" fill="#6366f1" rx="4"/>
  <rect x="92" y="98" width="56" height="18" fill="#2a2a40" rx="4"/>

  <text x="32" y="140" fill="#888" font-size="8" font-family="sans-serif">All Corners · 24px</text>
  <rect x="32" y="148" width="116" height="12" fill="#2a2a40" rx="6"/>
  <circle cx="60" cy="154" r="5" fill="#6366f1"/>

  <text x="32" y="180" fill="#888" font-size="8" font-family="sans-serif">Corners</text>
  <text x="32" y="196" fill="#666" font-size="7" font-family="monospace">↖ TL · 24px    ↗ TR · 24px</text>
  <text x="32" y="210" fill="#666" font-size="7" font-family="monospace">↙ BL · 24px    ↘ BR · 24px</text>

  <!-- Preview -->
  <rect x="176" y="20" width="404" height="180" fill="#1e1e32" rx="8"/>

  <!-- Rounded rects showing different radii -->
  <rect x="210" y="50" width="100" height="60" fill="url(#box)" rx="24"/>
  <text x="260" y="84" fill="#fff" font-size="8" font-family="monospace" text-anchor="middle" opacity="0.8">24px</text>

  <rect x="330" y="50" width="100" height="60" fill="url(#box)" rx="48"/>
  <text x="380" y="84" fill="#fff" font-size="8" font-family="monospace" text-anchor="middle" opacity="0.8">48px</text>

  <rect x="270" y="130" width="100" height="60" fill="url(#box)" rx="12"/>
  <text x="320" y="164" fill="#fff" font-size="8" font-family="monospace" text-anchor="middle" opacity="0.8">12px</text>

  <!-- Code -->
  <rect x="176" y="210" width="404" height="50" fill="#1a1a2e" rx="6"/>
  <circle cx="198" cy="235" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="212" cy="235" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="226" cy="235" r="4" fill="#22c55e" opacity="0.6"/>
  <text x="250" y="238" fill="#a5b4fc" font-size="10" font-family="monospace">border-radius: 24px;</text>

  <text x="36" y="240" fill="#fff" font-size="12" font-family="sans-serif" font-weight="600">Border Radius</text>
  <text x="36" y="254" fill="#666" font-size="8" font-family="sans-serif">symmetric · independent · px / %</text>
</svg>

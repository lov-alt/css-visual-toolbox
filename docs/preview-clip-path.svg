<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="img" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <clipPath id="hex">
      <polygon points="300,20 560,130 560,230 300,280 40,230 40,130"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="600" height="280" fill="url(#bg)" rx="12"/>

  <!-- Left panel (controls) -->
  <rect x="20" y="20" width="140" height="240" fill="#1e1e32" rx="8"/>

  <!-- Controls - shape type -->
  <rect x="32" y="34" width="116" height="20" fill="#2a2a40" rx="4"/>
  <text x="90" y="48" fill="#888" font-size="8" font-family="sans-serif" text-anchor="middle">Shape Type</text>

  <!-- Controls - preset buttons -->
  <rect x="32" y="62" width="36" height="16" fill="#6366f1" rx="4" opacity="0.3"/>
  <rect x="72" y="62" width="36" height="16" fill="#2a2a40" rx="4"/>
  <rect x="112" y="62" width="36" height="16" fill="#2a2a40" rx="4"/>

  <!-- Controls - point list -->
  <rect x="32" y="88" width="116" height="120" fill="#2a2a40" rx="4" opacity="0.5"/>
  <rect x="38" y="94" width="12" height="8" fill="#6366f1" rx="2"/>
  <rect x="54" y="94" width="36" height="8" fill="#3a3a52" rx="2"/>
  <rect x="94" y="94" width="36" height="8" fill="#3a3a52" rx="2"/>
  <rect x="38" y="108" width="12" height="8" fill="#6366f1" rx="2"/>
  <rect x="54" y="108" width="36" height="8" fill="#3a3a52" rx="2"/>
  <rect x="94" y="108" width="36" height="8" fill="#3a3a52" rx="2"/>
  <rect x="38" y="122" width="12" height="8" fill="#6366f1" rx="2"/>
  <rect x="54" y="122" width="36" height="8" fill="#3a3a52" rx="2"/>
  <rect x="94" y="122" width="36" height="8" fill="#3a3a52" rx="2"/>

  <!-- Right side - Preview area -->
  <rect x="176" y="20" width="404" height="180" fill="#1e1e32" rx="8"/>

  <!-- Preview - dim background -->
  <rect x="250" y="40" width="250" height="140" fill="url(#img)" rx="8" opacity="0.4"/>
  <!-- Preview - clipped bright area -->
  <rect x="250" y="40" width="250" height="140" fill="url(#img)" rx="8" clip-path="url(#hex)"/>
  <!-- Dashed outline -->
  <rect x="250" y="40" width="250" height="140" stroke="#fff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 3" rx="8" clip-path="url(#hex)"/>

  <!-- Code panel -->
  <rect x="176" y="210" width="404" height="50" fill="#1a1a2e" rx="6"/>
  <circle cx="198" cy="235" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="212" cy="235" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="226" cy="235" r="4" fill="#22c55e" opacity="0.6"/>
  <text x="250" y="238" fill="#a5b4fc" font-size="10" font-family="monospace">clip-path: polygon(50% 7%, 93% 46%, 93% 82%, ...);</text>

  <!-- Title -->
  <text x="36" y="240" fill="#fff" font-size="12" font-family="sans-serif" font-weight="600">Clip Path</text>
  <text x="36" y="254" fill="#666" font-size="8" font-family="sans-serif">polygon · circle · ellipse · inset</text>
</svg>
